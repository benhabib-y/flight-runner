name: Flight price check

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 minutes (odd minutes avoid GitHub's busiest times)
  workflow_dispatch:                # adds a "Run workflow" button for manual checks

# Read-only: the job never changes anything on GitHub.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      # Actions pinned to exact commits (tag in the comment) so they can't change underneath you.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      # Every package must match the hashes in requirements.txt.
      - run: pip install --require-hashes -r requirements.txt
      - run: python flight_runner.py
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          SHEET_KEY: ${{ secrets.SHEET_KEY }}
